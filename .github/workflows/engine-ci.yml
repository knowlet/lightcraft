# Native regression coverage for the engine and its workspace dependencies.
name: Engine CI

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - ".cargo/**"
      - "*rust-toolchain*"
      - "*rustfmt.toml"
      - "*clippy.toml"
      - "assets/fonts/**"
      - .github/workflows/engine-ci.yml
  pull_request:
    paths:
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - ".cargo/**"
      - "*rust-toolchain*"
      - "*rustfmt.toml"
      - "*clippy.toml"
      - "assets/fonts/**"
      - .github/workflows/engine-ci.yml

permissions:
  contents: read

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2

jobs:
  engine:
    name: Engine tests and lint (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: engine-ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint engine and all its targets
        run: cargo clippy --locked -p lightcraft-engine --all-targets -- -D warnings
      - name: Test engine
        run: cargo test --locked -p lightcraft-engine
